Description: |
  iClock 是一款专注于心流状态与智能协作的极简 Windows 桌面悬浮倒计时、每日金句与 AI 智能体命令行协同工具。
  特性：
  - 434 KB 原生单文件，零第三方依赖
  - 置顶悬浮且支持鼠标完全穿透（不挡全屏游戏与日常操作）
  - 全局快捷键一键启停（默认 Ctrl+Shift+T）
  - 每日专注目标与护眼提醒，托盘显示今日累计，进行中的倒计时可在今日记录里查看
  - 多智能体统一状态条，直接读取智能体自己的会话记录（Claude Code、OpenAI Codex、Antigravity、Cursor），状态真实无拼接
  - 用时统计始终开启（只记进程名），并提供按天趋势视图
  - 内存占用小于 10 MB，纯净无广告、无多余后台驻留
