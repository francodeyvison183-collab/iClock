ShortDescription: Ultra-lightweight (434 KB) Windows timer, daily quotes, AI agent status bar, and CLI-based desktop collaboration tool.
Description: |
  iClock is a minimalist Windows desktop timer with daily quotes, a multi-agent AI status bar, and CLI-based desktop collaboration.
  Features:
  - 434 KB single portable binary with zero external dependencies
  - Topmost and mouse click-through support
  - Global hotkey toggle (Ctrl+Shift+T by default)
  - Daily focus goal, an eye-care reminder, a tray history hint, and in-progress sessions
  - Unified multi-agent status bar that reads each agent's own session log (Claude Code, OpenAI Codex, Antigravity, Cursor)
  - Always-on usage tracking (process names only) with a per-day trend view
  - AI agents can request decisions, update the status bar, show progress, and send completion alerts through the CLI with structured JSON responses
  - Memory footprint under 10 MB
  - 100% green, portable, and ad-free
