ShortDescription: Ultra-lightweight (169 KB), zero-dependency, click-through desktop countdown timer and AI agent monitor for Windows.
Description: |
  iClock is a pure, minimalist desktop floating countdown tool and AI agent completion monitor for Windows.
  Features:
  - 169 KB single portable binary with zero external dependencies
  - Topmost and mouse click-through support
  - Global hotkey toggle (Ctrl+Shift+T by default)
  - Memory footprint under 15 MB
  - Background AI Agent task completion alerts (Cursor, Antigravity, Claude Code, Trae, etc.)
  - 100% green, portable, and ad-free
