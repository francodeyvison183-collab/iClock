ShortDescription: Ultra-lightweight (304 KB) Windows timer, daily quotes, AI agent monitor, and CLI-based desktop collaboration tool.
Description: |
  iClock is a minimalist Windows desktop timer with daily quotes, AI agent completion monitoring, and CLI-based desktop collaboration.
  Features:
  - 304 KB single portable binary with zero external dependencies
  - Topmost and mouse click-through support
  - Global hotkey toggle (Ctrl+Shift+T by default)
  - AI agents can request decisions, show progress, and send completion alerts through the CLI with structured JSON responses
  - Memory footprint under 15 MB
  - Background AI Agent task completion alerts (Cursor, Antigravity, Claude Code, Trae, etc.)
  - 100% green, portable, and ad-free
