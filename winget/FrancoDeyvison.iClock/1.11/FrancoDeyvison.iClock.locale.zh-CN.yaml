Description: |
  iClock 是一款专注于心流状态与智能协作的极简 Windows 桌面悬浮倒计时、每日格言与 AI 智能体命令行协同工具。
  特性：
  - 298 KB 原生单文件，零第三方依赖
  - 置顶悬浮且支持鼠标完全穿透（不挡全屏游戏与日常操作）
  - 全局快捷键一键启停（默认 Ctrl+Shift+T）
  - 内存占用小于 15 MB，纯净无广告、无多余后台驻留
  - AI 智能体后台长任务完成监控（支持 Cursor、Antigravity、Claude Code、Trae 等）
