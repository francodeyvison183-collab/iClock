<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="dialog-header" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="480" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Code/Desktop Mockup Window -->
  <g transform="translate(40, 36)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect width="880" height="408" rx="10" fill="#1e1e2e" stroke="#313244" stroke-width="1" />
    <!-- Window Titlebar -->
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 870 0 A 10 10 0 0 1 880 10 L 880 34 L 0 34 Z" fill="#181825" />
    <circle cx="20" cy="17" r="5" fill="#f38ba8" />
    <circle cx="36" cy="17" r="5" fill="#f9e2af" />
    <circle cx="52" cy="17" r="5" fill="#a6e3a1" />
    <text x="76" y="21" fill="#a6adc8" font-family="-apple-system, Segoe UI, sans-serif" font-size="12">workspace - iClock.cs (Visual Studio Code)</text>

    <!-- Code Editor Content Mock -->
    <g opacity="0.45" font-family="Consolas, Monaco, monospace" font-size="13">
      <text x="30" y="70" fill="#6c7086">01</text>
      <text x="65" y="70" fill="#cba6f7">using</text><text x="110" y="70" fill="#cdd6f4"> System;</text>
      <text x="30" y="95" fill="#6c7086">02</text>
      <text x="65" y="95" fill="#cba6f7">using</text><text x="110" y="95" fill="#cdd6f4"> System.Windows.Forms;</text>
      <text x="30" y="120" fill="#6c7086">03</text>
      <text x="30" y="145" fill="#6c7086">04</text>
      <text x="65" y="145" fill="#f38ba8">internal sealed class</text><text x="235" y="145" fill="#f9e2af"> AppContext</text><text x="325" y="145" fill="#cdd6f4"> : ApplicationContext</text>
      <text x="30" y="170" fill="#6c7086">05</text>
      <text x="65" y="170" fill="#cdd6f4">{</text>
      <text x="30" y="195" fill="#6c7086">06</text>
      <text x="95" y="195" fill="#89b4fa">    // 103 KB · 0.0% CPU · Click-Through Transparent Countdown</text>
      <text x="30" y="220" fill="#6c7086">07</text>
      <text x="95" y="220" fill="#cba6f7">    private void</text><text x="200" y="220" fill="#89b4fa"> Tick</text><text x="235" y="220" fill="#cdd6f4">() => </text><text x="290" y="220" fill="#a6e3a1">overlay.UpdateText(formatted);</text>
      <text x="30" y="245" fill="#6c7086">08</text>
      <text x="65" y="245" fill="#cdd6f4">}</text>
    </g>

    <!-- Overlay Transparent Display Simulation -->
    <g transform="translate(180, 110)">
      <!-- Click-Through Indicator Box (dashed outline) -->
      <rect width="360" height="120" rx="12" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.65" />
      <text x="180" y="26" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="1">
        ✦ DESKTOP OVERLAY (CLICK-THROUGH) ✦
      </text>

      <!-- The Core Countdown Time -->
      <text x="180" y="85" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Consolas, sans-serif" font-size="54" font-weight="800" filter="url(#text-glow)" letter-spacing="2">
        00:24:58
      </text>
      <text x="180" y="108" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="11">
        鼠标完全穿透 · 不影响打字与编码 · 全局热键 Ctrl+Alt+Space
      </text>
    </g>

    <!-- NoticeDialog Mockup on Bottom Right -->
    <g transform="translate(570, 180)" filter="url(#shadow)">
      <rect width="270" height="185" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <!-- Dialog Header -->
      <path d="M 0 10 A 10 10 0 0 1 10 0 L 260 0 A 10 10 0 0 1 270 10 L 270 28 L 0 28 Z" fill="#0f172a" />
      <circle cx="15" cy="14" r="4" fill="#38bdf8" />
      <text x="26" y="18" fill="#e2e8f0" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="bold">iClock - 倒计时结束 (TopMost)</text>

      <!-- Dialog Body -->
      <text x="135" y="60" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" font-weight="bold">倒计时结束</text>
      <text x="135" y="96" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="28" font-weight="800">00:00:00</text>
      <text x="135" y="122" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="11">结束时间: 14:30:00 (+00:05)</text>

      <!-- Dialog Button -->
      <rect x="85" y="140" width="100" height="30" rx="6" fill="#0284c7" />
      <text x="135" y="160" text-anchor="middle" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" font-weight="bold">确定 (OK)</text>
    </g>

    <!-- Bottom Feature Pills -->
    <g transform="translate(30, 360)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="120" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#22c55e" />
      <text x="26" y="17" fill="#e2e8f0" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">103 KB 单文件</text>

      <!-- Pill 2 -->
      <rect x="130" y="0" width="115" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="144" cy="13" r="4" fill="#22c55e" />
      <text x="156" y="17" fill="#e2e8f0" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">0.0% CPU 占用</text>

      <!-- Pill 3 -->
      <rect x="255" y="0" width="135" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="269" cy="13" r="4" fill="#38bdf8" />
      <text x="281" y="17" fill="#e2e8f0" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">点击穿透 / 置顶</text>

      <!-- Pill 4 -->
      <rect x="400" y="0" width="130" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="414" cy="13" r="4" fill="#a855f7" />
      <text x="426" y="17" fill="#e2e8f0" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">零依赖 · 纯本地</text>
    </g>
  </g>
</svg>
